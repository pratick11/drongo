<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drongo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d10'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='3' y1='29' x2='28' y2='4' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%230b5a7a'/%3E%3Cstop offset='.55' stop-color='%230b8f7a'/%3E%3Cstop offset='1' stop-color='%2319c37d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M14.2 16.6C11.8 20.6 8.2 23.7 4.2 25.7' stroke='url(%23g)' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M15.8 17.4C15.5 21.7 14 25.8 11.4 28.6' stroke='url(%23g)' stroke-width='2' stroke-linecap='round'/%3E%3Cellipse cx='3.9' cy='26.2' rx='2.4' ry='1.3' transform='rotate(-64 3.9 26.2)' fill='url(%23g)'/%3E%3Cellipse cx='11.2' cy='29.2' rx='2.4' ry='1.3' transform='rotate(-82 11.2 29.2)' fill='url(%23g)'/%3E%3Cpath d='M20.2 6.2 18.6 3l3.4 2.2z' fill='url(%23g)'/%3E%3Ccircle cx='21.2' cy='8.9' r='3.2' fill='url(%23g)'/%3E%3Cellipse cx='15.9' cy='13.4' rx='5.7' ry='4.2' transform='rotate(-24 15.9 13.4)' fill='url(%23g)'/%3E%3Cpath d='M24.1 7.9 28.4 9 24.2 10.4z' fill='url(%23g)'/%3E%3Ccircle cx='22' cy='8.5' r='0.95' fill='%23ff5a4d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <a class="brand" href="#/" title="Drongo — Today">
          <span class="brand-mark">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="iris" x1="3" y1="29" x2="28" y2="4" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#0b5a7a"/>
                  <stop offset=".55" stop-color="#0b8f7a"/>
                  <stop offset="1" stop-color="#19c37d"/>
                </linearGradient>
              </defs>
              <path d="M14.2 16.6C11.8 20.6 8.2 23.7 4.2 25.7" stroke="url(#iris)" stroke-width="2" stroke-linecap="round"/>
              <path d="M15.8 17.4C15.5 21.7 14 25.8 11.4 28.6" stroke="url(#iris)" stroke-width="2" stroke-linecap="round"/>
              <ellipse cx="3.9" cy="26.2" rx="2.4" ry="1.3" transform="rotate(-64 3.9 26.2)" fill="url(#iris)"/>
              <ellipse cx="11.2" cy="29.2" rx="2.4" ry="1.3" transform="rotate(-82 11.2 29.2)" fill="url(#iris)"/>
              <path d="M20.2 6.2 18.6 3l3.4 2.2z" fill="url(#iris)"/>
              <circle cx="21.2" cy="8.9" r="3.2" fill="url(#iris)"/>
              <ellipse cx="15.9" cy="13.4" rx="5.7" ry="4.2" transform="rotate(-24 15.9 13.4)" fill="url(#iris)"/>
              <path d="M24.1 7.9 28.4 9 24.2 10.4z" fill="url(#iris)"/>
              <circle cx="22" cy="8.5" r="0.95" fill="var(--eye, #ff5a4d)"/>
            </svg>
          </span>
          <span class="brand-name label">Drongo</span>
        </a>
        <button class="icon-btn" id="sb-collapse" title="Collapse sidebar" aria-label="Collapse sidebar"></button>
      </div>

      <div class="sb-actions">
        <button class="btn primary block" id="sb-new"><span class="i"></span><span class="label">New session</span></button>
        <button class="btn ghost block" id="sb-practice" title="Practice recall from your knowledge graph"><span class="i"></span><span class="label">Practice</span><span class="pill due" id="sb-due-pill" hidden></span></button>
      </div>

      <nav class="sb-nav" aria-label="Views">
        <a href="#/" data-view="dashboard"><span class="i"></span><span class="label">Today</span></a>
        <a href="#/graph" data-view="graph"><span class="i"></span><span class="label">Graph</span><span class="pill" id="nav-props" hidden></span></a>
      </nav>

      <div class="sb-scroll">
        <div class="sb-sec" id="sb-workspaces" hidden>
          <h3>Workspaces</h3>
          <div id="ws-list"></div>
        </div>
        <div class="sb-sec" id="sb-recent" hidden>
          <h3>Recent</h3>
          <div id="recent-list"></div>
        </div>
      </div>

      <div class="sb-foot">
        <div class="sb-stats label" id="sb-stats"></div>
        <div class="sb-foot-row">
          <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
          <a class="icon-btn" href="#/settings" title="Settings" aria-label="Settings"></a>
          <span class="model-chip label" id="model-chip" title="Model provider"></span>
        </div>
      </div>
    </aside>
    <div class="sb-backdrop" id="sb-backdrop"></div>

    <main class="main">
      <header class="mainbar">
        <button class="icon-btn only-mobile" id="sb-menu" aria-label="Open sidebar"></button>
        <div class="mainbar-title" id="mainbar-title">Today</div>
        <div class="mainbar-actions" id="mainbar-actions"></div>
      </header>
      <div class="content" id="app"></div>
    </main>
  </div>

  <div class="cg-scrim" id="cg-scrim" hidden></div>
  <aside class="cg-drawer" id="cg-drawer" aria-hidden="true"></aside>

  <div id="toast" role="status"></div>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/pele.global.js"></script>
  <script src="/app.js"></script>
</body>
</html>
