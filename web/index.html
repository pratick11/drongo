<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drongo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect width='32' height='32' rx='8' fill='%231a1b26'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='3' y1='29' x2='28' y2='4' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%237aa2f7'/%3E%3Cstop offset='.55' stop-color='%237dcfff'/%3E%3Cstop offset='1' stop-color='%23bb9af7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M14.2 16.6C11.8 20.6 8.2 23.7 4.2 25.7' stroke='url(%23g)' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M15.8 17.4C15.5 21.7 14 25.8 11.4 28.6' stroke='url(%23g)' stroke-width='2' stroke-linecap='round'/%3E%3Cellipse cx='3.9' cy='26.2' rx='2.4' ry='1.3' transform='rotate(-64 3.9 26.2)' fill='url(%23g)'/%3E%3Cellipse cx='11.2' cy='29.2' rx='2.4' ry='1.3' transform='rotate(-82 11.2 29.2)' fill='url(%23g)'/%3E%3Cpath d='M20.2 6.2 18.6 3l3.4 2.2z' fill='url(%23g)'/%3E%3Ccircle cx='21.2' cy='8.9' r='3.2' fill='url(%23g)'/%3E%3Cellipse cx='15.9' cy='13.4' rx='5.7' ry='4.2' transform='rotate(-24 15.9 13.4)' fill='url(%23g)'/%3E%3Cpath d='M24.1 7.9 28.4 9 24.2 10.4z' fill='url(%23g)'/%3E%3Ccircle cx='22' cy='8.5' r='0.95' fill='%23f7768e'/%3E%3C/svg%3E" />
  <script>
    // Paint the saved theme before first frame. Tokyo Night is the default.
    try {
      document.documentElement.dataset.theme = localStorage.getItem("drongo-theme") || "tokyo-night";
    } catch (e) {
      document.documentElement.dataset.theme = "tokyo-night";
    }
  </script>
  <link rel="stylesheet" href="/themes/tokyo-night.css" />
  <link rel="stylesheet" href="/themes/paper.css" />
  <link rel="stylesheet" href="/themes/catppuccin.css" />
  <link rel="stylesheet" href="/themes/dracula.css" />
  <link rel="stylesheet" href="/themes/github-dark.css" />
  <link rel="stylesheet" href="/themes/gruvbox.css" />
  <link rel="stylesheet" href="/themes/monokai.css" />
  <link rel="stylesheet" href="/themes/nord.css" />
  <link rel="stylesheet" href="/themes/one-dark.css" />
  <link rel="stylesheet" href="/themes/rose-pine.css" />
  <link rel="stylesheet" href="/themes/solarized.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <a class="brand" href="#/" title="Drongo — Library">
          <span class="brand-mark">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="iris" x1="3" y1="29" x2="28" y2="4" gradientUnits="userSpaceOnUse">
                  <stop style="stop-color: var(--iris-a)"/>
                  <stop offset=".55" style="stop-color: var(--iris-b)"/>
                  <stop offset="1" style="stop-color: var(--iris-c)"/>
                </linearGradient>
              </defs>
              <path d="M14.2 16.6C11.8 20.6 8.2 23.7 4.2 25.7" stroke="url(#iris)" stroke-width="2" stroke-linecap="round"/>
              <path d="M15.8 17.4C15.5 21.7 14 25.8 11.4 28.6" stroke="url(#iris)" stroke-width="2" stroke-linecap="round"/>
              <ellipse cx="3.9" cy="26.2" rx="2.4" ry="1.3" transform="rotate(-64 3.9 26.2)" fill="url(#iris)"/>
              <ellipse cx="11.2" cy="29.2" rx="2.4" ry="1.3" transform="rotate(-82 11.2 29.2)" fill="url(#iris)"/>
              <path d="M20.2 6.2 18.6 3l3.4 2.2z" fill="url(#iris)"/>
              <circle cx="21.2" cy="8.9" r="3.2" fill="url(#iris)"/>
              <ellipse cx="15.9" cy="13.4" rx="5.7" ry="4.2" transform="rotate(-24 15.9 13.4)" fill="url(#iris)"/>
              <path d="M24.1 7.9 28.4 9 24.2 10.4z" fill="url(#iris)"/>
              <circle cx="22" cy="8.5" r="0.95" fill="var(--eye, #ff5a4d)"/>
            </svg>
          </span>
          <span class="brand-name label">Drongo</span>
        </a>
        <button class="icon-btn" id="sb-collapse" title="Collapse sidebar" aria-label="Collapse sidebar"></button>
      </div>

      <div class="sb-actions">
        <button class="btn primary block" id="sb-add"><span class="i" data-icon="plus"></span><span class="label">Add blog</span></button>
      </div>

      <nav class="sb-nav" aria-label="Views">
        <a href="#/" data-view="library" data-icon="book"><span class="i"></span><span class="label">Library</span></a>
      </nav>

      <div class="sb-scroll">
        <div class="sb-sec">
          <h3>Saved</h3>
          <div id="blog-list"><p class="sb-empty">Nothing saved yet.</p></div>
        </div>
      </div>

      <div class="sb-foot">
        <div class="sb-foot-row">
          <div class="theme-picker">
            <button class="icon-btn" id="theme-toggle" aria-label="Theme" aria-haspopup="true" aria-expanded="false"></button>
            <div class="theme-menu" id="theme-menu" role="menu" aria-label="Theme" hidden></div>
          </div>
          <a class="icon-btn" href="#/settings" data-icon="settings" title="Settings" aria-label="Settings"></a>
          <span class="model-chip label" id="model-chip" title="Model provider"></span>
        </div>
      </div>
    </aside>
    <div class="sb-backdrop" id="sb-backdrop"></div>

    <main class="main">
      <header class="mainbar">
        <button class="icon-btn only-mobile" id="sb-menu" aria-label="Open sidebar"></button>
        <div class="mainbar-title" id="mainbar-title">Library</div>
        <div class="mainbar-actions" id="mainbar-actions"></div>
      </header>
      <div class="content" id="app"></div>
    </main>
  </div>

  <div id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
